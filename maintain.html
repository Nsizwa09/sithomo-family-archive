<!DOCTYPE html>
<html lang="zu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sithomo - Under Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #120e0b;
      --text-gold: #f2e3c6;
      --accent-gold: #d4a359;
      --muted-gold: #9c8a70;
      --badge-bg: rgba(212, 163, 89, 0.1);
      --font-heading: 'Playfair Display', Georgia, serif;
      --font-body: 'Inter', -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(255, 255, 255, 0.015),
        rgba(255, 255, 255, 0.015) 1px,
        transparent 1px,
        transparent 10px
      );
      color: var(--text-gold);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    /* Gear Container & Animation */
    .gear-container {
      margin-bottom: 2rem;
      color: var(--accent-gold);
    }

    .gear-icon {
      width: 72px;
      height: 72px;
      animation: spin 8s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    /* Status Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: var(--badge-bg);
      border: 1px solid rgba(212, 163, 89, 0.2);
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--accent-gold);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-gold);
      border-radius: 50%;
    }

    /* Brand Header */
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border: 1px solid var(--accent-gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-size: 1rem;
      color: var(--accent-gold);
    }

    .brand-name {
      font-family: var(--font-heading);
      font-size: 1.75rem;
      font-weight: 700;
    }

    /* Heading & Description */
    .title {
      font-family: var(--font-heading);
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.2;
      font-weight: 700;
      margin-bottom: 1rem;
      max-width: 600px;
    }

    .description {
      font-size: 1rem;
      color: var(--muted-gold);
      max-width: 480px;
      line-height: 1.6;
      font-weight: 300;
    }
  </style>
</head>
<body>

  <div class="brand">
    <div class="brand-logo">s</div>
    <span class="brand-name">Sithomo</span>
  </div>

  <div class="gear-container">
    <svg class="gear-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
    </svg>
  </div>

  <div class="badge">
    <span class="badge-dot"></span>
    <span>Isiza Siyalungiswa</span>
  </div>

  <h1 class="title">Website Down for Maintenance</h1>

  <p class="description">
    I Website yethu okwamanje ayitholakali ngenxa yomsebenzi wokuyilungisa nokuya phezulu. Siyaxolisa ngokuphazamiseka, sizobuya maduze.
  </p>

</body>
</html>
